# HTTPRoute for kubernetes-mcp-server (Traefik)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - kubernetes-mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/mcp/kubernetes/
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes-mcp-server
          port: 8000
