# HTTPRoute for kubernetes-mcp-server (Traefik)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - kubernetes-mcp.homelab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Gate every request behind Traefik BasicAuth (see middleware.yaml).
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kubernetes-mcp-basicauth
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes-mcp-server
          port: 8080
          weight: 1
