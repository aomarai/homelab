# kubernetes-mcp-server values
# Latest: v0.0.66

# Image configuration
image:
  repository: ghcr.io/containers/kubernetes-mcp-server
  pullPolicy: IfNotPresent
  tag: "v0.0.66"

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
---
# Traefik HTTPRoute (Gateway: /api/mcp/kubernetes/)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp-server
  namespace: mcp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - kubernetes-mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/mcp/kubernetes/
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes-mcp-server
          port: 8000
