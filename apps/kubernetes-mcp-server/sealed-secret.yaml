# SealedSecret for the kubernetes-mcp-server BasicAuth htpasswd.
# Encrypted to the sealed-secrets-controller public key (kube-system); the
# plaintext never lives in Git. To re-seal after a controller key rotation:
#   printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: kubernetes-mcp-basicauth\n  namespace: mcp\ntype: Opaque\nstringData:\n  users: <htpasswd>\n' \
#     | kubeseal --cert <controller-cert.pem> --format yaml > sealed-secret.yaml
#
# Credential re-sealed 2026-10-19 against the current controller key (sealed-secrets-keyrnpm8).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: kubernetes-mcp-basicauth
  namespace: mcp
spec:
  encryptedData:
    users: 
  template:
    metadata:
      name: kubernetes-mcp-basicauth
      namespace: mcp
    type: Opaque
